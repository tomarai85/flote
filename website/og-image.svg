<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#13131a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Logo mark -->
  <rect x="540" y="100" width="120" height="120" rx="24" fill="url(#accent-grad)"/>
  <text x="600" y="186" fill="#0a0a0f" font-size="76" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" text-anchor="middle">F</text>

  <!-- Word mark -->
  <text x="600" y="290" fill="#ffffff" font-size="92" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" text-anchor="middle" letter-spacing="-2">Flote</text>

  <!-- Tagline -->
  <text x="600" y="370" fill="#e8e8ec" font-size="38" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Noto Sans JP', sans-serif" text-anchor="middle">走り書きが、勝手に整理される。</text>

  <!-- Subtitle -->
  <text x="600" y="440" fill="#a0a0a8" font-size="26" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Noto Sans JP', sans-serif" text-anchor="middle">macOS native ・ 完全無料 beta ・ source-available (FSL)</text>

  <!-- URL footer -->
  <text x="600" y="555" fill="#2dd4bf" font-size="28" font-weight="500" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">flote-app.vercel.app</text>

  <!-- Endorsed badge bottom-right -->
  <text x="1140" y="600" fill="#56565e" font-size="18" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" text-anchor="end">a Direct product</text>
</svg>
