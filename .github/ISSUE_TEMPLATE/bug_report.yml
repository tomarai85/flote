name: Bug Report
description: Flote が期待通り動かない / 警告 / クラッシュ等の報告
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。 再現手順を書いてもらえると助かります。

  - type: input
    id: macos_version
    attributes:
      label: macOS バージョン
      description: メニュー > このMacについて で確認
      placeholder: "14.5 (Sonoma) / 15.1 (Sequoia) etc"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: ハードウェア
      description: Apple Silicon (M1/M2/M3/M4) or Intel
      placeholder: "M2 MacBook Air"
    validations:
      required: true

  - type: input
    id: flote_version
    attributes:
      label: Flote バージョン
      description: メニューバーアイコン > About か、 zip ダウンロード日
      placeholder: "v0.1.0 / 2026-05-27 ダウンロード"

  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      description: 何をしたら起きるか
      placeholder: |
        1. Option+Space で付箋を出す
        2. 「テスト」 と入力
        3. Organize ボタンを押す
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
      placeholder: AI が整理してくれる
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      placeholder: クラッシュした / 何も起きない / エラー が出た
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ / スクリーンショット (任意)
      description: Console.app の Flote ログや スクショ あれば貼ってください
      render: text
