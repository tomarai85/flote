name: Bug Report
description: Flote does not behave as expected -- a warning, a crash, anything wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Steps to reproduce help more than anything else.

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      description: Apple menu > About This Mac
      placeholder: "14.5 (Sonoma) / 15.1 (Sequoia) etc"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Apple Silicon (M1/M2/M3/M4) or Intel
      placeholder: "M2 MacBook Air"
    validations:
      required: true

  - type: input
    id: flote_version
    attributes:
      label: Flote version
      description: Menu bar icon > About, or the date you downloaded the zip
      placeholder: "v0.1.0 / downloaded 2026-05-27"

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do to trigger it
      placeholder: |
        1. Press Option+Space to summon a note
        2. Type "test"
        3. Press Organize
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The AI organizes the note
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      placeholder: It crashed / nothing happened / an error appeared
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Flote lines from Console.app, or a screenshot, if you have them
      render: text
