name: Feature Request
description: 新機能 / 改善 提案
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。 「なぜ欲しいか」 が一番大事です。

  - type: textarea
    id: problem
    attributes:
      label: どんな問題を解決したいか
      description: 機能の前に、 困ってることを書いてください
      placeholder: "Flote に大量にメモを書いた後、 過去メモを検索したい時に...が困る"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      placeholder: "全文検索 hotkey (Option+F 等) で過去メモを検索できる UI"

  - type: textarea
    id: alternatives
    attributes:
      label: 試した代替手段
      description: 他ツール / 他 workflow / 他 hotkey 等
      placeholder: "Spotlight で grep してるが、 Flote 専用 storage location が分からず断念"

  - type: dropdown
    id: priority
    attributes:
      label: 優先度 (= 自分にとって)
      options:
        - "もしあれば嬉しい (= nice to have)"
        - "あれば日常的に使う"
        - "これがないと使わなくなる"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **note**: Flote は「整理できない人向けの個人メモ (= α 路線)」 に scope 集中しています。 共有 / 同期 / collaboration 系の feature は別 product seed として扱われ、 Flote 本体には追加されない可能性があります。 詳細は [business/](https://github.com/tomarai85/flote/tree/main/business)。
