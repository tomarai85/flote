name: Feature Request
description: A new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Why you want it matters more than what it is.

  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve
      description: Describe what is getting in your way, before the feature itself
      placeholder: "After writing a lot of notes in Flote, going back to find an old one is..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: "A full-text search hotkey (Option+F or similar) with a UI for past notes"

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Other tools, other workflows, other hotkeys
      placeholder: "Grepping with Spotlight, but I could not find where Flote stores its notes"

  - type: dropdown
    id: priority
    attributes:
      label: How much you want it
      options:
        - "Nice to have"
        - "I would use it daily"
        - "Without it I would stop using Flote"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Note**: Flote's scope is deliberately narrow -- personal notes for people who
        are bad at organizing. Sharing, syncing and collaboration features are treated as
        seeds for separate products and may never land in Flote itself.
