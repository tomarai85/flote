# Builds and zips a Windows release of Flote on GitHub Actions.

name: Build Windows

on:
  # A version tag produces a distributable Windows build.
  push:
    tags: ['v*']

  # A manual run may override the version string.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: Windows Release
    runs-on: windows-latest

    # Least privilege that still allows checkout on a private repo.
    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin Flutter and cache dependencies.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      # Resolve the version from manual input, then the tag, then pubspec.yaml.
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') {
            $v = '${{ github.event.inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}' -replace '^v',''
          } else {
            $v = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -split '\s+')[1] } | Select-Object -First 1) -split '\+' | Select-Object -First 1
          }
          echo "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version: $v"

      # Copy the release output into a dist folder, zip it, print the hash.
      - name: Package as Zip
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dst = "dist/flote-windows-v$v"
          if (Test-Path $dst) {
            Remove-Item -Recurse -Force $dst
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" $dst
          $zip = "dist/flote-windows-v$v.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$dst/*" -DestinationPath $zip
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      # Keep the zip as an artifact for verification and distribution.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flote-windows-v${{ steps.ver.outputs.version }}
          path: apps/flutter/dist/flote-windows-v${{ steps.ver.outputs.version }}.zip
          retention-days: 30
